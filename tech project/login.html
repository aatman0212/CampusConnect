<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Login & Register</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            min-height: 100vh;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .auth-header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #ffffff;
            padding: 32px 28px 24px;
            text-align: center;
        }

        .auth-header .logo {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .auth-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .auth-header p {
            font-size: 0.88rem;
            color: #e0e7ff;
            margin-top: 4px;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background-color: #f8fafc;
        }

        .auth-tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
            border: none;
            background: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .auth-tab.active {
            color: var(--primary);
            background: #ffffff;
            border-bottom: 3px solid var(--primary);
        }

        .auth-body {
            padding: 28px;
        }

        .demo-login-box {
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 22px;
        }

        .demo-login-box p {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #475569;
            margin-bottom: 8px;
        }

        .demo-btns {
            display: flex;
            gap: 10px;
        }

        .demo-btns button {
            flex: 1;
            padding: 8px 10px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: #334155;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .demo-btns button:hover {
            background-color: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">🎓</div>
            <h2>CampusConnect</h2>
            <p>Your portal for university events, hackathons & squads</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
            <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Create Account</button>
        </div>

        <div class="auth-body">
            <!-- 1-Click Demo Login Box -->
            <div class="demo-login-box">
                <p>⚡ Quick Demo Testing Logins:</p>
                <div class="demo-btns">
                    <button type="button" onclick="demoLogin('student')">
                        🎓 Demo Student
                    </button>
                    <button type="button" onclick="demoLogin('admin')">
                        🛡️ Demo Admin
                    </button>
                </div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Campus Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="name@campus.edu" required value="alex.rivera@campus.edu">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required value="password123">
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                    Sign In →
                </button>
                
                <div style="text-align: center; margin-top: 16px; font-size: 0.88rem; color: var(--text-muted);">
                    Don't have an account? <a href="javascript:void(0)" onclick="switchTab('register')" style="color: var(--primary); font-weight: 600;">Register here</a>
                </div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" class="form-control" placeholder="Jane Doe" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="regEmail">University Email</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="jane@campus.edu" required>
                    </div>
                    <div class="form-group">
                        <label for="regPhone">Phone Number</label>
                        <input type="tel" id="regPhone" class="form-control" placeholder="10-digit number" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="regRoll">Roll / Student ID</label>
                        <input type="text" id="regRoll" class="form-control" placeholder="CS-2024-001" required>
                    </div>
                    <div class="form-group">
                        <label for="regBranch">Branch / Major</label>
                        <input type="text" id="regBranch" class="form-control" placeholder="e.g. Computer Science" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regRole">Account Type</label>
                    <select id="regRole" class="form-control" required>
                        <option value="student">Student / Attendee</option>
                        <option value="organizer">Club Organizer / Society Lead</option>
                        <option value="admin">Campus Administrator</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="regPassword">Create Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                    Create Account →
                </button>

                <div style="text-align: center; margin-top: 16px; font-size: 0.88rem; color: var(--text-muted);">
                    Already registered? <a href="javascript:void(0)" onclick="switchTab('login')" style="color: var(--primary); font-weight: 600;">Sign in</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/store.js"></script>
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        function demoLogin(type) {
            if (type === 'student') {
                document.getElementById('loginEmail').value = 'alex.rivera@campus.edu';
                document.getElementById('loginPassword').value = 'password123';
            } else {
                document.getElementById('loginEmail').value = 'admin@campus.edu';
                document.getElementById('loginPassword').value = 'admin123';
            }
            switchTab('login');
            Store.showToast(`Prefilled demo ${type} credentials! Click Sign In.`, 'info');
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;

            const res = Store.loginUser(email, pass);
            if (!res.success) {
                Store.showToast(res.message, 'error');
                return;
            }

            Store.showToast(`Welcome back, ${res.user.name}! Redirecting...`, 'success');
            setTimeout(() => {
                if (res.user.role === 'admin') {
                    window.location.href = 'approveeventadminpage.html';
                } else {
                    window.location.href = 'index.html';
                }
            }, 800);
        }

        function handleRegister(e) {
            e.preventDefault();
            const userData = {
                name: document.getElementById('regName').value.trim(),
                email: document.getElementById('regEmail').value.trim(),
                phone: document.getElementById('regPhone').value.trim(),
                roll: document.getElementById('regRoll').value.trim(),
                branch: document.getElementById('regBranch').value.trim(),
                role: document.getElementById('regRole').value,
                password: document.getElementById('regPassword').value
            };

            const res = Store.registerUser(userData);
            if (!res.success) {
                Store.showToast(res.message, 'error');
                return;
            }

            Store.showToast(`Account created! Welcome, ${res.user.name}.`, 'success');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 900);
        }
    </script>
</body>
</html>
